<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Rare Stone</title>
<meta name="description" content="Illustration portfolio by Trhisell, TeamRareStone." />
<link rel="icon" type="image/png" href="assets/favicon.png?v=1" />
<link rel="stylesheet" href="style.css?v=15" />
</head>
<body>

<div class="bg-flow" aria-hidden="true"></div>

<section class="hero" id="heroView">
  <div class="logo-mark">
    <img class="logo-img" src="assets/logo.png" alt="Team Rare Stone" />
  </div>
  <p class="artist-credit">Illustration by <b>Trhisell</b></p>
  <p class="hero-tag">
    <a href="https://www.pixiv.net/users/238757" target="_blank" rel="noopener">pixiv.net/users/238757</a>
    <span class="tag-dot">&middot;</span>
    <a href="https://x.com/RARESTONE3" target="_blank" rel="noopener">x.com/RARESTONE3</a>
  </p>

  <div class="portals" id="portals" role="navigation" aria-label="Category navigation"></div>

  <p class="hero-foot">&copy; TeamRareStone &middot; <span class="foot-email">thesuperhero17@gmail.com</span></p>
</section>

<section class="gallery-view" id="galleryView" hidden>
  <div class="gallery-head">
    <button class="back-btn" id="backBtn">&#8592; Home</button>
    <img class="mini-logo-img" src="assets/logo.png" alt="Team Rare Stone" />
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Category filter"></nav>
  <div class="grid" id="grid"></div>

  <div class="foot">
    <span>&copy; TeamRareStone &middot; Illustration by Trhisell &middot; <span class="foot-email">thesuperhero17@gmail.com</span></span>
    <span>Filter by tab &middot; click an image to enlarge</span>
  </div>
</section>

<button class="to-top" id="toTop" aria-label="Back to top" type="button">&#8593;</button>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged view">
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <figure>
    <img id="lbImg" src="" alt="" />
    <figcaption>
      <span id="lbTitle"></span>
      <span class="c" id="lbCat"></span>
      <a id="lbXLink" class="lb-x-link" href="" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.6 8.7L23 22h-7l-5.5-6.9L4.1 22H1l8.1-9.3L1 2h7.2l5 6.3L18.9 2Zm-1.2 18h1.7L7.4 3.9H5.6L17.7 20Z"/></svg>
        <span>원본 트윗 보기</span>
      </a>
    </figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  <button class="lb-close" id="lbClose" aria-label="Close">&#10005;</button>
</div>

<div class="r18-confirm" id="r18Confirm" role="dialog" aria-modal="true" aria-label="Mature content confirmation">
  <div class="r18-box">
    <p>This piece is marked 18+ by the artist.<br />View it?</p>
    <div class="r18-actions">
      <button class="r18-cancel" id="r18Cancel">Cancel</button>
      <button class="r18-view" id="r18View">View</button>
    </div>
  </div>
</div>

<script src="app.js?v=8"></script>
</body>
</html>
